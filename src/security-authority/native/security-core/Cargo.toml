[package]
edition = "2021"
name = "security-core"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.4", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16.2"
aes-gcm = "0.10.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
rand = "0.8.5"
dirs = "5.0.1"
windows = { version = "0.52", features = ["Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO"] }
lazy_static = "1.5.0"
hex = "0.4.3"
hmac = "0.12.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading"
]

[build-dependencies]
napi-build = "2.1.3"
